<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9bf0"/><stop offset="1" stop-color="#5563c9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2b3170" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- back card -->
  <rect x="300" y="250" width="440" height="560" rx="64" fill="#c9cff8" transform="rotate(-9 520 530)" filter="url(#sh)"/>
  <!-- front card -->
  <g filter="url(#sh)">
    <rect x="290" y="230" width="444" height="566" rx="64" fill="#ffffff"/>
  </g>
  <!-- clip -->
  <rect x="432" y="196" width="160" height="72" rx="30" fill="#5563c9"/>
  <!-- checklist rows -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="378" cy="372" r="34" fill="#dff3e4"/><path d="M362 372 l12 13 l22 -26" stroke="#3f9a5c" stroke-width="15" fill="none"/>
    <rect x="436" y="358" width="230" height="28" rx="14" fill="#e3e6fb"/>
    <circle cx="378" cy="492" r="34" fill="#dff3e4"/><path d="M362 492 l12 13 l22 -26" stroke="#3f9a5c" stroke-width="15" fill="none"/>
    <rect x="436" y="478" width="190" height="28" rx="14" fill="#e3e6fb"/>
    <circle cx="378" cy="612" r="34" fill="#fff3c4"/>
    <rect x="436" y="598" width="210" height="28" rx="14" fill="#e3e6fb"/>
  </g>
  <!-- cute face on the front card -->
  <g fill="#3a3f7a">
    <circle cx="470" cy="706" r="13"/><circle cx="554" cy="706" r="13"/>
  </g>
  <path d="M492 728 q20 20 40 0" stroke="#3a3f7a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="446" cy="732" r="16" fill="#f7b6c4" opacity=".8"/><circle cx="578" cy="732" r="16" fill="#f7b6c4" opacity=".8"/>
  <!-- heart badge -->
  <g transform="translate(700 640)" filter="url(#sh)">
    <circle r="92" fill="#ff8fa6"/>
    <path d="M0 38 C -60 -2 -52 -50 -22 -50 C -8 -50 0 -38 0 -30 C 0 -38 8 -50 22 -50 C 52 -50 60 -2 0 38 Z" fill="#fff"/>
  </g>
  <!-- sparkle -->
  <path d="M790 250 l14 36 l36 14 l-36 14 l-14 36 l-14 -36 l-36 -14 l36 -14 z" fill="#fff" opacity=".9"/>
</svg>
